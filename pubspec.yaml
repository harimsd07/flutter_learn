name: flutterlearn
description: "FlutterLearn — An interactive Flutter widget learning app with live demos, code snippets, and explanations."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  shared_preferences: ^2.3.2
  http: ^1.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_icon.png"
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
  windows:
    generate: true
    image_path: "assets/logo/app_icon.png"
  macos:
    generate: true
    image_path: "assets/logo/app_icon.png"
  linux:
    generate: true
    image_path: "assets/logo/app_icon.png"

flutter:
  uses-material-design: true